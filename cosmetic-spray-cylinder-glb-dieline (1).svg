<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="226mm" height="223mm" viewBox="0 0 226 223">
  <defs>
    <style>
      .txt-title { font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 4.5px; fill: #111827; }
      .txt-meta { font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-size: 2.8px; fill: #4b5563; }
      .txt-dim { font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-size: 2.6px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .dim-line { stroke: #6b7280; stroke-width: 0.25; fill: none; }
      .cut-line { stroke: #ff007f; stroke-width: 0.45; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .crease-line { stroke: #00a651; stroke-width: 0.45; stroke-dasharray: 2 1.5; fill: none; stroke-linecap: round; }
      .bleed-line { stroke: #00a0e9; stroke-width: 0.35; stroke-dasharray: 1.5 1.5; fill: none; }
      .safe-line { stroke: #2e7d32; stroke-width: 0.25; stroke-dasharray: 0.8 1.2; fill: none; }
    </style>
  </defs>
  <!-- 1. SHEET BACKGROUND -->
  <g id="layer-sheet">
    <rect width="226" height="223" fill="#ffffff" />
  </g>

  <!-- 2. SEMANTIC PANELS (3D CYLINDER UV MAPPING: DEPAN 0°-180° & BELAKANG 180°-360°) -->
  <g id="layer-panels">
    <!-- Panel Muka Depan (Front Face 0° - 180°) -->
    <rect id="face-front" data-face="front" x="30" y="30" width="63" height="98" fill="rgba(37, 99, 235, 0.04)" stroke="rgba(37, 99, 235, 0.3)" stroke-width="0.3" stroke-dasharray="1.5 1.5" />
    <text x="61.5" y="79" class="txt-dim" fill="#64748b" font-size="3.2px">MUKA DEPAN (FRONT 0° - 180°)</text>

    <!-- Panel Muka Belakang (Back Face 180° - 360°) -->
    <rect id="face-back" data-face="back" x="93" y="30" width="63" height="98" fill="rgba(37, 99, 235, 0.02)" stroke="rgba(37, 99, 235, 0.3)" stroke-width="0.3" stroke-dasharray="1.5 1.5" />
    <text x="124.5" y="79" class="txt-dim" fill="#64748b" font-size="3.2px">MUKA BELAKANG (BACK 180° - 360°)</text>
    
    <!-- Garis Pemisah Visual Sisi Botol -->
    <line x1="93" y1="30" x2="93" y2="128" stroke="#94a3b8" stroke-width="0.3" stroke-dasharray="2 1.5" />
  </g>

  <!-- 3. ARTWORK & FACE COLOR LAYER (Warna Dasar Stiker & Desain Grafis) -->
  <g id="Artwork-Layer">
    <!-- Stiker Base / Face Color Fill (Warna Dasar Stiker Botol) -->
    <rect x="30" y="30" width="126" height="98" rx="2" fill="#FFFFFF" stroke="none" />
  </g>
  <!-- 3MM SAFE MARGIN -->
  <g id="Safe-Zone" class="safe-line">
    <path d="M 34 33 L 152 33 Q 153 33 153 34 L 153 124 Q 153 125 152 125 L 34 125 Q 33 125 33 124 L 33 34 Q 33 33 34 33 Z"/>
  </g>
  <!-- 3MM BLEED OUTLINE -->
  <g id="Bleed-3mm" class="bleed-line">
    <path d="M 32 27 L 154 27 Q 159 27 159 32 L 159 126 Q 159 131 154 131 L 32 131 Q 27 131 27 126 L 27 32 Q 27 27 32 27 Z"/>
  </g>
  <!-- DIE CUT LINE (Spot Magenta #ff007f) -->
  <g id="Dieline-Cut" class="cut-line">
    <path d="M 32 30 L 154 30 Q 156 30 156 32 L 156 126 Q 156 128 154 128 L 32 128 Q 30 128 30 126 L 30 32 Q 30 30 32 30 Z"/>
  </g>
  <!-- CREASE / SCORE LINES (Green Dashed #00a651) -->
  <g id="Crease-Score" class="crease-line">

  </g>
  <!-- TECHNICAL DIMENSIONS & REGISTRATION -->
  <g id="Technical-Annotations">
    <!-- Registration Crosshairs -->
    <g stroke="#222222" stroke-width="0.3" fill="none"><circle cx="10" cy="10" r="3"/><line x1="5" y1="10" x2="15" y2="10"/><line x1="10" y1="5" x2="10" y2="15"/></g>
    <g stroke="#222222" stroke-width="0.3" fill="none"><circle cx="216" cy="10" r="3"/><line x1="211" y1="10" x2="221" y2="10"/><line x1="216" y1="5" x2="216" y2="15"/></g>
    <g stroke="#222222" stroke-width="0.3" fill="none"><circle cx="10" cy="213" r="3"/><line x1="5" y1="213" x2="15" y2="213"/><line x1="10" y1="208" x2="10" y2="218"/></g>
    <g stroke="#222222" stroke-width="0.3" fill="none"><circle cx="216" cy="213" r="3"/><line x1="211" y1="213" x2="221" y2="213"/><line x1="216" y1="208" x2="216" y2="218"/></g>
    <!-- Dimension Lines -->
<line x1="30" y1="140" x2="156" y2="140" class="dim-line"/><circle cx="30" cy="140" r="0.6" fill="#6b7280"/><circle cx="156" cy="140" r="0.6" fill="#6b7280"/><text x="93" y="138.5" class="txt-dim">126 mm Wrap</text>
<line x1="168" y1="30" x2="168" y2="128" class="dim-line"/><circle cx="168" cy="30" r="0.6" fill="#6b7280"/><circle cx="168" cy="128" r="0.6" fill="#6b7280"/><text x="168" y="77.5" class="txt-dim">98 mm Height</text>
    <!-- Title Block & Specifications Header -->
    <g transform="translate(10, 199)">
      <rect x="0" y="0" width="206" height="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.3" rx="1.5"/>
      <text x="5" y="5.5" class="txt-title">Cosmetic Spray / Deodorant Cylinder (mesh) — Production Dieline</text>
      <text x="5" y="10" class="txt-meta">Finished Size: 126 x 98 mm | Bleed: +3.0 mm | Scale: 100% 1:1</text>
      <text x="5" y="14.5" class="txt-meta">Shape: Cylindrical Body Wrap Label (126 x 98 mm) | Material: Pressure Sensitive Label (PSL) / Wet-Glue Paper / BOPP Film</text>
      <!-- Legend -->
      <g transform="translate(106, 4)">
        <line x1="0" y1="2" x2="10" y2="2" class="cut-line"/>
        <text x="12" y="3" class="txt-meta">Cut Line</text>
        <line x1="45" y1="2" x2="55" y2="2" class="bleed-line"/>
        <text x="57" y="3" class="txt-meta">Bleed (3mm)</text>
        <line x1="0" y1="8.5" x2="10" y2="8.5" class="crease-line"/>
        <text x="12" y="9.5" class="txt-meta">Crease Line</text>
        <line x1="45" y1="8.5" x2="55" y2="8.5" class="safe-line"/>
        <text x="57" y="9.5" class="txt-meta">Safe Zone</text>
      </g>
    </g>
  </g>
</svg>